<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Header Styles */
        .header {
            background: linear-gradient(to right, #daec92, #2f2e2e);
            padding: 15px 20px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: translateY(-100%);
            animation: slideDown 0.8s ease-in-out forwards;
        }

        /* Navigation Menu */
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Slide-Down Animation */
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li> <!-- Added Home link -->
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="performance.html">Performance</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="ranklist.html">Rank List</a></li>
            <li><a href="student_list.html">Student List</a></li>
        </ul>
    </div>

</body>
</html>
