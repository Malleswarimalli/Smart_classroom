<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body { background: linear-gradient(to right, #2C3E50, #4CA1AF); color: white; text-align: center; }
        .btn { padding: 10px; background: white; color: #4CA1AF; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Profile</h2>
    <p>Username: <span id="profile-name"></span></p>
    <button onclick="logout()" class="btn">Logout</button>

    <script>
        document.getElementById("profile-name").innerText = localStorage.getItem("user");
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
